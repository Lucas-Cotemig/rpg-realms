<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RPG Realms</title>
  <meta name="description" content="Mesa de RPG online para jogar com os amigos em tempo real.">
  <link rel="icon" href="/img/sigil.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="dieGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6d45c9"/>
        <stop offset=".55" stop-color="#3b2275"/>
        <stop offset="1" stop-color="#1c1038"/>
      </linearGradient>
      <linearGradient id="dieGradNeg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7a2f2f"/>
        <stop offset="1" stop-color="#2a0f0f"/>
      </linearGradient>
      <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f6dc96"/>
        <stop offset="1" stop-color="#b8862e"/>
      </linearGradient>
    </defs>
  </svg>
  <div id="conn" class="conn-bar hidden">Reconectando ao servidor…</div>
  <div id="app"><div class="loading"><div><div class="spinner"></div>Abrindo os portões…</div></div></div>
  <div class="toast-wrap" id="toasts"></div>
  <script src="/vendor/supabase.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
